default_profile: default
providers:
  deepseek:
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
models:
  utterance_attribution:
    provider: deepseek
    model: deepseek-flash
    enabled: true
    temperature: 0.0
    max_tokens: 1024
    thinking_type: disabled
    timeout_seconds: 60
    response_format:
      type: json_object
  clarification_wording:
    provider: deepseek
    model: deepseek-flash
    enabled: true
    temperature: 0.0
    max_tokens: 1024
    thinking_type: disabled
    timeout_seconds: 60
    response_format:
      type: json_object
  gold_user_simulation:
    provider: deepseek
    model: deepseek-chat
    enabled: true
    temperature: 0.0
    max_tokens: 512
    thinking_type: disabled
    timeout_seconds: 120
    response_format:
      type: json_object
roles:
  utterance_attribution: utterance_attribution
  clarification_wording: clarification_wording
  gold_user_simulation: gold_user_simulation
profiles:
  default:
    roles:
      utterance_attribution: utterance_attribution
      clarification_wording: clarification_wording
      gold_user_simulation: gold_user_simulation
    network_policy: online
memory:
  enabled: false
  storage:
    format: PreferenceSQLiteVecStoreV1
    path: null
  retrieval:
    encoder_id: intfloat/multilingual-e5-small@614241f622f53c4eeff9890bdc4f31cfecc418b3:query-prefix:l2-normalized-f32:cpu:max-seq-512:st-6.2.0:torch-2.15.0:transformers-5.22.1:tokenizers-0.23.3:numpy-2.5.4
    similarity: COSINE
    tau_r: 0.75
    semantic_top_k: 20
    aliases: {}
  scoring:
    method: EXPONENTIAL_TIME_DECAY
    age_unit: UTC_CALENDAR_DAYS
    half_life_days: 30.0
  decision:
    policy: GLOBAL_TWO_THRESHOLD
    tau_auto: 0.85
    m_min: 2
    parameter_set_id: CADENCE_MEMORY_ENGINE_NO_HISTORY_FLOOR
    calibration_id: null
    validation_fingerprint: null
