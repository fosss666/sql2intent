[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.1.0"
description = "Candidate-grounded interactive disambiguation for Text-to-SQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "sqlglot>=25,<29",
    "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
memory-encoder = ["sentence-transformers==6.2.0"]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cadence*", "tools*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cadence", "tools"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true
